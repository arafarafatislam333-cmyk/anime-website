<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime World</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🎌 Anime World</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">Anime List</a>
        <a href="#">Top Rated</a>
    </nav>
</header>

<section class="hero">
    <h2>Welcome to Anime World</h2>
    <p>Discover the best anime of all time!</p>
    <button>Explore Now</button>
</section>

<section class="anime-list">
    <h2>Popular Anime</h2>
    <div class="cards">

        <div class="card">
            <img src="https://cdn.myanimelist.net/images/anime/1208/94745.jpg" alt="Naruto">
            <h3>Naruto</h3>
            <p>⭐ 8.5/10</p>
            <span>Action | Adventure</span>
        </div>

        <div class="card">
            <img src="https://cdn.myanimelist.net/images/anime/1517/100633.jpg" alt="Attack on Titan">
            <h3>Attack on Titan</h3>
            <p>⭐ 9.0/10</p>
            <span>Action | Drama</span>
        </div>

        <div class="card">
            <img src="https://cdn.myanimelist.net/images/anime/1286/99889.jpg" alt="Demon Slayer">
            <h3>Demon Slayer</h3>
            <p>⭐ 8.7/10</p>
            <span>Action | Fantasy</span>
        </div>

    </div>
</section>

<script src="script.js"></script>
</body>
</html>
